
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Jarvis AI</title>
<style>
body {
  background: #07111f;
  color: #00eaff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px 15px;
}
h1 { font-size: 36px; }
.circle {
  width: 150px;
  height: 150px;
  border: 4px solid #00eaff;
  border-radius: 50%;
  margin: 30px auto;
  display: grid;
  place-items: center;
  font-size: 55px;
  box-shadow: 0 0 30px #00eaff;
}
button {
  padding: 15px 25px;
  margin: 10px;
  border: 2px solid #00eaff;
  border-radius: 12px;
  background: #10243b;
  color: #00eaff;
  font-size: 18px;
}
#answer { color: white; font-size: 20px; }
</style>
</head>
<body>

<h1>JARVIS AI</h1>
<p>Your Personal Assistant</p>

<div class="circle">🤖</div>

<button onclick="speak('Hello Sir, Jarvis is ready.')">
  Start Jarvis
</button>

<button onclick="listen()">🎤 बोलिए</button>

<p id="answer">मैं आपकी मदद के लिए तैयार हूँ।</p>

<script>
function speak(text) {
  document.getElementById("answer").innerText = text;
  let msg = new SpeechSynthesisUtterance(text);
  msg.lang = "hi-IN";
  speechSynthesis.speak(msg);
}

function listen() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    speak("आपके ब्राउज़र में Voice Recognition उपलब्ध नहीं है।");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.start();

  recognition.onresult = function(event) {
    const command =
      event.results[0][0].transcript.toLowerCase();

    document.getElementById("answer").innerText = command;

    if (command.includes("हेलो") ||
        command.includes("hello")) {
      speak("Hello Sir, मैं आपका Jarvis हूँ।");
    } else if (command.includes("समय") ||
               command.includes("टाइम")) {
      speak("अभी समय है " +
        new Date().toLocaleTimeString("hi-IN"));
    } else if (command.includes("तारीख") ||
               command.includes("डेट")) {
      speak("आज की तारीख है " +
        new Date().toLocaleDateString("hi-IN"));
    } else if (command.includes("नाम")) {
      speak("मेरा नाम Jarvis है।");
    } else {
      speak("माफ कीजिए सर, मैं अभी यह कमांड नहीं समझ पाया।");
    }
  };

  recognition.onerror = function() {
    speak("माइक्रोफोन की अनुमति जाँचिए और दोबारा कोशिश कीजिए।");
  };
}
</script>

</body>
</html>
